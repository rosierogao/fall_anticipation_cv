[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-anticipation-cv"
version = "0.1.0"
description = "Computer-vision baseline for fall anticipation from video windows."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "opencv-python",
  "pandas",
  "scikit-learn",
  "torch",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
